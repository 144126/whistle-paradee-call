<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>edit</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="modulepreload" href="lib/phonon-0.4.0/index.js">
<style>
  @property --beam { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  :root {
    color-scheme: dark;
    --bg: #000000; --surface: #1c1c1e; --raised: #2c2c2e; --edge: #3a3a3c; --line: #1c1c1e;
    --text: #f5f5f7; --soft: #c7c7cc; --muted: #8e8e93; --orange: #ff9f0a; --bad: #ff6961;
    --font: Inter, -apple-system, "SF Pro Text", "Inter Tight", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", "DejaVu Sans Mono", monospace;
    --column: 720px;
    --fast: 160ms;
    --out: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); scrollbar-width: thin; scrollbar-color: var(--raised) transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 var(--font); font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

  /* ---------- bars ---------- */
  #top { position: fixed; inset: 0 0 auto; z-index: 3; height: 64px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px 0 28px; font-size: 14px; color: var(--muted); background: linear-gradient(var(--bg) 50%, transparent); }
  #file { margin: 0; display: flex; align-items: center; gap: 8px; min-width: 0; }
  #name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #dirty { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); transform: scale(0); transition: transform 240ms var(--out); }
  body[data-dirty] #dirty { transform: scale(1); }
  nav { display: flex; gap: 2px; }
  nav button { min-height: 40px; padding: 0 12px; border-radius: 10px; color: var(--muted); transition: color var(--fast), background-color var(--fast), transform 200ms var(--out); }
  nav button:hover { color: var(--text); background: var(--surface); }
  nav button:active { transform: scale(0.96); }

  #bar { position: fixed; inset: auto 0 0; z-index: 3; height: 56px; background: var(--bg); border-top: 1px solid var(--line); }
  #progress { position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--orange); transform: scaleX(0); transform-origin: left;
    transition: opacity 900ms 300ms; }
  #progress[data-done] { opacity: 0; }
  #bar_in { max-width: calc(var(--column) + 64px); height: 100%; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 20px; font-size: 14px; }
  #caption { flex: 1; min-width: 0; margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); }
  #caption[data-tone=hearing] { color: var(--text); }
  #caption[data-tone=sent] { color: var(--orange); }
  #caption[data-tone=bad] { color: var(--bad); }
  #caption:is([data-tone=hearing], [data-tone=sent])::before { content: "“"; }
  #caption:is([data-tone=hearing], [data-tone=sent])::after { content: "”"; }
  #caption.rise { animation: rise 320ms var(--out); }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); filter: blur(3px); } }
  #range { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #listen { display: flex; align-items: center; gap: 9px; color: var(--muted); white-space: nowrap; }
  #mic { position: relative; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted);
    transform: scale(calc(1 + var(--lv, 0) * 0.6)); transition: background-color var(--fast), border-color var(--fast); }
  #mic::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; background: var(--orange); opacity: calc(var(--lv, 0) * 0.35); }
  #mic:is([data-state=listening], [data-state=hearing]) { background: var(--orange); border-color: var(--orange); }
  #mic[data-state=speaking] { border-color: var(--orange); }
  #mic[data-state=loading] { border-color: var(--orange); animation: breathe 1.4s ease-in-out infinite; }
  #mic[data-state=off] { border-color: var(--bad); }
  @keyframes breathe { 50% { opacity: 0.35; } }

  /* ---------- the document ---------- */
  main { padding: 112px 32px 50vh; }
  body[data-drop] main { outline: 1.5px dashed var(--orange); outline-offset: -12px; border-radius: 20px; }
  #sheet { position: relative; max-width: var(--column); margin: 0 auto; }
  #rows { position: relative; z-index: 1; }
  #hint { margin: 20px 0 0; font-size: 14px; color: var(--muted); }

  #box, #work { position: absolute; top: 0; left: -14px; right: -14px; border-radius: 12px; pointer-events: none; }
  /* the selection: springs move its two edges (lib/edit/spring.mjs), and it glows with your voice while you talk about it */
  #box { border: 1px solid color-mix(in oklab, var(--orange) 55%, transparent); background: color-mix(in oklab, var(--orange) 4%, transparent);
    box-shadow: 0 0 calc(var(--lv, 0) * 30px) color-mix(in oklab, var(--orange) calc(var(--lv, 0) * 40%), transparent);
    transition: border-color var(--fast), background-color var(--fast); will-change: transform, height; }
  #box[data-hearing] { border-color: var(--orange); background: color-mix(in oklab, var(--orange) 7%, transparent); }
  /* the lines the model is rewriting: a light runs round their edge and sweeps across them */
  #work { z-index: 2; opacity: 0; overflow: hidden; transition: opacity 260ms; }
  #work[data-on] { opacity: 1; }
  #work::before { content: ""; position: absolute; inset: 0; padding: 1.5px; border-radius: inherit;
    background: conic-gradient(from var(--beam), transparent 0turn 0.62turn, var(--orange) 0.9turn, transparent 1turn);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; animation: beam 1.5s linear infinite; }
  #work::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, color-mix(in oklab, var(--orange) 14%, transparent) 50%, transparent 65%);
    background-size: 260% 100%; animation: sweep 1.7s var(--out) infinite; }
  #work[data-bad]::before { background: var(--bad); animation: none; }
  #work[data-bad]::after { animation: none; background: color-mix(in oklab, var(--bad) 10%, transparent); }
  @keyframes beam { to { --beam: 1turn; } }
  @keyframes sweep { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  /* the line being read aloud */
  #reader { position: absolute; top: 0; left: -26px; width: 3px; border-radius: 2px; background: var(--orange); opacity: 0; pointer-events: none;
    box-shadow: 0 0 calc(2px + var(--vl, 0) * 14px) color-mix(in oklab, var(--orange) calc(30% + var(--vl, 0) * 70%), transparent); }

  .row { --tint: color-mix(in oklab, var(--orange) calc(var(--sel, 0) * 100%), var(--text));
    position: relative; min-height: calc(1.6em + 4px); padding: 2px 0; color: var(--tint); white-space: pre-wrap; overflow-wrap: anywhere; cursor: default;
    transition: opacity 260ms; }
  .row.busy { opacity: 0.5; }
  .row.born { animation: born 560ms var(--out) both; animation-delay: calc(min(var(--i), 14) * 38ms); }
  @keyframes born { from { opacity: 0; transform: translateY(7px); filter: blur(8px); } }
  .row[data-kind=h1] { padding-top: 16px; font-size: 32px; line-height: 1.2; font-weight: 650; letter-spacing: -0.025em; }
  .row[data-kind=h2] { padding-top: 12px; font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -0.018em; }
  .row[data-kind=h3] { padding-top: 6px; font-size: 20px; line-height: 1.4; font-weight: 600; letter-spacing: -0.01em; }
  .row:is([data-kind=h4], [data-kind=h5], [data-kind=h6]) { font-weight: 600; }
  .row[data-kind=h6] { --tint: color-mix(in oklab, var(--orange) calc(var(--sel, 0) * 100%), var(--muted)); }
  .row:is([data-kind=li], [data-kind=ol], [data-kind=task]) { display: flex; gap: 12px; padding-left: calc(var(--depth, 0) * 26px); }
  .mark { flex: none; min-width: 12px; color: color-mix(in oklab, var(--orange) calc(var(--sel, 0) * 100%), var(--muted)); font-variant-numeric: tabular-nums; }
  .row[data-kind=ol] .mark { min-width: 22px; text-align: right; }
  .mark.box { width: 15px; height: 15px; min-width: 0; margin-top: calc(0.8em - 7px); border: 1.5px solid currentColor; border-radius: 5px; }
  .row[data-done] .mark.box { background: currentColor; box-shadow: inset 0 0 0 2.5px var(--bg); }
  .row[data-done] .text { color: color-mix(in oklab, var(--orange) calc(var(--sel, 0) * 100%), var(--muted)); }
  .row[data-kind=quote] { padding-left: calc(18px + var(--depth, 0) * 14px); color: color-mix(in oklab, var(--orange) calc(var(--sel, 0) * 100%), var(--soft)); }
  .row[data-kind=quote]::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px; border-radius: 1px; background: var(--edge); }
  .row:is([data-kind=hr], [data-kind=table-sep])::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: color-mix(in oklab, var(--orange) calc(var(--sel, 0) * 100%), var(--edge)); }
  .row:is([data-kind=code], [data-kind=fence]) { padding: 1px 16px; background: var(--surface); font: 14px/1.75 var(--mono); }
  .row[data-kind=fence] { color: color-mix(in oklab, var(--orange) calc(var(--sel, 0) * 100%), var(--muted)); font-size: 12px; }
  .row[data-edge=top] { padding-top: 8px; border-radius: 10px 10px 0 0; }
  .row[data-edge=bottom] { border-radius: 0 0 10px 10px; }
  .row[data-kind=table] { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); font-size: 15px; }
  .cell { padding: 0 12px; border-left: 1px solid var(--edge); }
  .cell:first-child { padding-left: 0; border-left: 0; }
  .row code { padding: 1px 5px; border-radius: 5px; background: var(--surface); font: 0.86em var(--mono); }
  .row strong { font-weight: 620; }
  .row s { opacity: 0.6; }
  .link { text-decoration: underline; text-decoration-color: color-mix(in oklab, currentColor 40%, transparent); text-underline-offset: 3px; }
  .img { color: color-mix(in oklab, var(--orange) calc(var(--sel, 0) * 100%), var(--muted)); font-style: italic; }

  /* ---------- settings ---------- */
  #scrim { position: fixed; inset: 0; z-index: 4; background: #000; opacity: 0; pointer-events: none; }
  body[data-settings] #scrim { pointer-events: auto; }
  #drawer { position: fixed; z-index: 5; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); overflow-y: auto; padding: 24px 28px 48px;
    background: var(--surface); transform: translateX(100%); box-shadow: -30px 0 80px rgb(0 0 0 / 0.6); font-size: 14px; }
  #drawer header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #drawer h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  #s_close { min-height: 40px; padding: 0 12px; margin-right: -12px; border-radius: 10px; color: var(--muted); transition: color var(--fast), background-color var(--fast); }
  #s_close:hover { color: var(--text); background: var(--raised); }
  #drawer section { display: grid; gap: 14px; padding: 22px 0; border-bottom: 1px solid var(--edge); }
  #drawer section:last-child { border-bottom: 0; }
  #drawer h3 { margin: 0; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
  #drawer label { display: grid; gap: 7px; color: var(--soft); }
  #drawer input:not([type=radio]) { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--edge); border-radius: 10px; background: var(--bg);
    color: var(--text); font: 14px var(--font); outline: none; transition: border-color var(--fast), box-shadow var(--fast); }
  #drawer input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px color-mix(in oklab, var(--orange) 20%, transparent); }
  .pair { display: flex; align-items: center; gap: 8px; }
  .pair input { flex: 1; min-width: 0; }
  .pair button { flex: none; height: 40px; padding: 0 14px; border-radius: 10px; background: var(--raised); color: var(--soft); transition: color var(--fast); }
  .pair button:hover { color: var(--text); }
  .unit { color: var(--muted); }
  .note { margin: -6px 0 0; font-size: 12px; color: var(--muted); }
  #s_mode { display: flex; margin: 0; padding: 3px; border: 0; border-radius: 12px; background: var(--bg); }
  #s_mode legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  #s_mode label { flex: 1; display: grid; place-items: center; min-height: 36px; border-radius: 9px; color: var(--muted); cursor: pointer;
    transition: background-color var(--fast), color var(--fast); }
  #s_mode input { position: absolute; opacity: 0; pointer-events: none; }
  #s_mode label:has(input:checked) { background: var(--raised); color: var(--text); font-weight: 550; }
  #s_mode label:has(input:focus-visible) { outline: 2px solid var(--orange); outline-offset: -2px; }
  .switch_row { display: flex; align-items: center; justify-content: space-between; min-height: 40px; color: var(--soft); }
  [role=switch] { position: relative; width: 42px; height: 26px; border-radius: 13px; background: var(--edge); transition: background-color 220ms; }
  [role=switch]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text);
    box-shadow: 0 1px 3px rgb(0 0 0 / 0.4); transition: transform 320ms cubic-bezier(0.3, 1.4, 0.5, 1); }
  [role=switch][aria-checked=true] { background: var(--orange); }
  [role=switch][aria-checked=true]::after { transform: translateX(16px); }
  .key_row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; color: var(--soft); }
  .key { min-width: 64px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--raised); color: var(--text); font-size: 13px;
    transition: box-shadow var(--fast), color var(--fast), transform 200ms var(--out); }
  .key:hover { box-shadow: 0 0 0 1px var(--edge); }
  .key:active { transform: scale(0.96); }
  .key[data-capturing] { color: var(--orange); box-shadow: 0 0 0 1.5px var(--orange); animation: breathe 1.4s ease-in-out infinite; }
  #s_keys_note { min-height: 18px; margin: 0; font-size: 12px; color: var(--bad); }

  @media (max-width: 640px) {
    main { padding-inline: 24px; }
    #range { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<header id="top">
  <p id="file"><span id="name"></span><i id="dirty" title="not saved to the file"></i></p>
  <nav><button id="open">open</button><button id="save">save</button><button id="open_settings">settings</button></nav>
</header>

<main>
  <div id="sheet">
    <div id="box" aria-hidden="true"></div>
    <div id="work" aria-hidden="true"></div>
    <div id="reader" aria-hidden="true"></div>
    <div id="rows"></div>
    <p id="hint" hidden>open a .md file (ctrl+o), drop one here, or just start talking</p>
  </div>
</main>

<footer id="bar">
  <i id="progress"></i>
  <div id="bar_in">
    <p id="caption" role="status" aria-live="polite"></p>
    <span id="range"></span>
    <span id="listen"><i id="mic"></i><span id="mode"></span></span>
  </div>
</footer>

<div id="scrim"></div>
<aside id="drawer" aria-label="settings" inert>
  <header><h2>settings</h2><button id="s_close">close</button></header>
  <section>
    <h3>model</h3>
    <label>base url <input id="s_base" spellcheck="false" autocomplete="off"></label>
    <label>api key <span class="pair"><input id="s_key" type="password" spellcheck="false" autocomplete="off"><button id="s_show">show</button></span></label>
    <p id="s_key_note" class="note"></p>
    <label>model <input id="s_model" spellcheck="false" autocomplete="off"></label>
  </section>
  <section>
    <h3>listening</h3>
    <fieldset id="s_mode">
      <legend>mode</legend>
      <label><input type="radio" name="mode" value="a">always on</label>
      <label><input type="radio" name="mode" value="p">push to talk</label>
    </fieldset>
    <label>silence before it sends <span class="pair"><input id="s_silence" type="number" min="300" max="10000" step="10"><span class="unit">ms</span></span></label>
  </section>
  <section>
    <h3>speaking</h3>
    <div class="switch_row">read one line when you land on it<button id="s_one" role="switch" aria-label="read one line"></button></div>
    <div class="switch_row">read several lines when you pick them<button id="s_many" role="switch" aria-label="read several lines"></button></div>
  </section>
  <section>
    <h3>keys</h3>
    <div id="s_keys"></div>
    <p id="s_keys_note"></p>
  </section>
</aside>

<script type="module" src="lib/edit/app.mjs"></script>
</html>
