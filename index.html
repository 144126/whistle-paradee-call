<script id="shared" type="text/js-worker">
async function get(url, name) {
  let cache;
  try { cache = await caches.open(name); const hit = await cache.match(url); if (hit) return hit; } catch {}
  const r = await fetch(url);
  if (!r.ok) throw new Error("download failed: " + url);
  try { await cache.put(url, r.clone()); } catch {}
  return r;
}
</script>

<script id="worker" type="text/js-worker">
const ENGINE = "https://huggingface.co/Cactus-Compute/needle3/resolve/c7c415a3d1b3d929014bc6e866d51ebb971f7089/wasm";
const MODEL = "https://huggingface.co/Cactus-Compute/whistle/resolve/b358ddadd89b7a713b5aa131f23032d3cca1b251/whistle.cact";
const CAP = 16384;

async function load() {
  const [js, wasm, model] = await Promise.all([
    get(ENGINE + "/needle.js", "whistle-v1").then(r => r.text()),
    get(ENGINE + "/needle.wasm", "whistle-v1").then(r => r.arrayBuffer()),
    get(MODEL, "whistle-v1").then(r => r.arrayBuffer()),
  ]);
  importScripts(URL.createObjectURL(new Blob([js], { type: "text/javascript" })));
  const m = await createNeedle({ wasmBinary: wasm });
  const bytes = new Uint8Array(model);
  const p = m._malloc(bytes.length);
  m.HEAPU8.set(bytes, p);
  if (m._needle_load(p, BigInt(bytes.length)) !== 0) throw new Error("model load failed");
  return { m, out: m._malloc(CAP) };
}

const ready = load();
ready.then(() => postMessage({ type: "ready" }), e => postMessage({ type: "error", message: String(e.message || e) }));

onmessage = async ({ data }) => {
  try {
    const { m, out } = await ready;
    const pcm = m._malloc(data.audio.byteLength);
    m.HEAPU8.set(new Uint8Array(data.audio.buffer), pcm);
    const n = m._needle_transcribe(pcm, data.audio.length, 0, 0, 0, out, CAP);
    m._free(pcm);
    if (n < 0) throw new Error("transcription failed");
    postMessage({ type: "transcript", sent: data.sent, transcript: JSON.parse(m.UTF8ToString(out)) });
  } catch (e) {
    postMessage({ type: "error", message: String(e.message || e) });
  }
};
</script>

<script id="voice" type="text/js-worker">
const MODEL = "https://huggingface.co/sahilmahendrakar/Paradee-8M-v1.1/resolve/330617ad1f097b4f6b02c103e54b39006c090b45/";
const MAX_PHONEMES = 510;
// espeak output -> misaki symbols, which Paradee was trained on (misaki/espeak.py E2M, untied form)
const MAP = [["aɪ","I"],["aʊ","W"],["eɪ","A"],["oʊ","O"],["ɔɪ","Y"],["dʒ","ʤ"],["tʃ","ʧ"],["ɚ","əɹ"],
  ["ɜː","ɜɹ"],["əl","ᵊl"],["ʲo","jo"],["ʲə","jə"],["ʲ",""],["r","ɹ"],["x","k"],["ç","k"],["ɐ","ə"],
  ["ɬ","l"],["̃",""],["ɾ","T"],["ʔ","t"],["ː",""],["̩",""]];

let ort, phonemize, session, vocab, base, threads, gen = 0, queue = [], busy = false, led = 0;

async function init() {
  ort = await import(base + "lib/ort.wasm.min.mjs");
  ort.env.wasm.wasmPaths = base + "lib/";
  // Measured on this model, one core each: 1 thread 7.4x real time, 2 threads 10.1x, 4 threads
  // 12.0x, 8 threads 10.1x. So ask for 4 and never more. onnxruntime's own default is
  // min(4, cores/2), which picks 2 on a four-core machine and leaves half the gain unclaimed.
  ort.env.wasm.numThreads = threads;
  ({ phonemize } = await import(base + "lib/phonemizer.js"));
  const [cfg, model] = await Promise.all([
    get(MODEL + "config.json", "paradee-v1").then(r => r.json()),
    // the fp32 weights, not paradee_int8.onnx: int8 is 4.1x smaller but measured 6% slower on one
    // thread and 10% slower on four, because this backend pays more to dequantise than it saves
    get(MODEL + "onnx/paradee.onnx", "paradee-v1").then(r => r.arrayBuffer()),
  ]);
  vocab = cfg.vocab;
  session = await ort.InferenceSession.create(new Uint8Array(model), {
    executionProviders: ["wasm"],
    graphOptimizationLevel: "all",
    enableMemPattern: true,
    enableCpuMemArena: true,
    executionMode: "sequential", // the wasm backend does not implement parallel execution
  });
}

// One phonemize() call for all clauses. Measured here, a warm call costs 1.6-1.9 ms plus 0.18 ms
// per character, so this is cheap; the ~0.7 s once blamed on it is all one-time (import, first
// call, then a tail of about 28 calls before espeak settles), and init below pays that up front.
// phonemize() returns one entry per clause and drops punctuation, so each piece keeps its own mark.
async function phonemizePieces(text) {
  const pieces = text.split(/(?<=[.!?…,;:])\s+|\n+/).map((s) => s.trim()).filter(Boolean);
  let entries = await phonemize(pieces.join("\n"));
  if (entries.length !== pieces.length) {
    entries = [];
    for (const p of pieces) entries.push((await phonemize(p)).join(" "));
  }
  return pieces.map((p, i) => {
    let ps = entries[i] || "";
    for (const [a, b] of MAP) ps = ps.split(a).join(b);
    return ps.replace(/ᵊ(?=ɹ)/g, "ə").trim() + (p.match(/[,;:.!?…]$/)?.[0] ?? "");
  }).filter((ps) => ps.length > 0);
}

// One model call per sentence keeps its intonation. The first call of an utterance is the exception:
// it is cut at the first clause. Synthesis costs about 0.074 s per second of audio, so a whole
// opening sentence means roughly a second of silence before anything plays, where its first clause
// means about a tenth of that. Later sentences stay whole, and their audio queues behind what is
// already playing, so nothing after the opening clause pays for this.
const LEAD_MIN = 12; // phonemes; a shorter lead clause is not worth its own call
function sentenceGroups(ps, lead) {
  const groups = [];
  let group = [];
  for (const p of ps) {
    group.push(p);
    if (/[.!?…]$/.test(p)) { groups.push(group); group = []; }
  }
  if (group.length) groups.push(group);
  if (lead && groups[0]?.length > 1 && groups[0][0].length >= LEAD_MIN) groups.splice(0, 1, [groups[0][0]], groups[0].slice(1));
  return groups.map((g) => g.join(" "));
}

function* chunks(ps) {
  while (ps.length > MAX_PHONEMES) {
    let cut = ps.lastIndexOf(" ", MAX_PHONEMES);
    if (cut <= 0) cut = MAX_PHONEMES;
    yield ps.slice(0, cut);
    ps = ps.slice(cut).trimStart();
  }
  if (ps) yield ps;
}

async function synth(ps) {
  const ids = [0, ...[...ps].map(c => vocab[c]).filter(x => x !== undefined), 0];
  const out = await session.run({
    input_ids: new ort.Tensor("int64", BigInt64Array.from(ids, BigInt), [1, ids.length]),
    speed: new ort.Tensor("float32", Float32Array.of(1), [1]),
  });
  return out[session.outputNames[0]].data.slice();
}

// Text for one utterance can arrive in pieces (a model streaming its reply). Everything queued
// is phonemized in one call, since each call has a large fixed cost.
async function pump() {
  if (busy) return;
  busy = true;
  try {
    while (queue.length) {
      const id = queue[0].id;
      let text = "", last = false;
      while (queue.length && queue[0].id === id) { const q = queue.shift(); text += " " + q.text; last ||= q.last; }
      if (text.trim() && gen === id) {
        speak: for (const group of sentenceGroups(await phonemizePieces(text.trim()), id !== led)) {
          for (const ps of chunks(group)) {
            await new Promise((r) => setTimeout(r)); // ONNX awaits never yield to the event loop, so stop would wait for the whole passage
            if (gen !== id) break speak;
            const samples = await synth(ps);
            led = id; // this utterance has started, so later sentences are not cut at a clause
            postMessage({ type: "audio", id, samples }, [samples.buffer]);
          }
        }
      }
      if (last && gen === id) postMessage({ type: "done", id });
    }
  } catch (e) {
    postMessage({ type: "error", message: "voice: " + (e.message || e) });
  }
  busy = false;
}

onmessage = async ({ data }) => {
  if (data.type === "init") {
    base = data.base;
    threads = data.threads;
    try {
      await init();
      // Warm-up, so the first reply pays none of it: the first ONNX run is slower, and espeak costs
      // 10-30 ms a call for its first ~28 calls before settling at about 3 ms.
      for (const group of sentenceGroups(await phonemizePieces("Hello there."))) await synth(group);
      for (let i = 0; i < 28; i++) await phonemize("warm up");
      postMessage({ type: "ready", threads: ort.env.wasm.numThreads });
    }
    catch (e) { postMessage({ type: "error", message: "voice: " + (e.message || e) }); }
  } else if (data.type === "speak") {
    if (data.id !== gen) queue = [];
    gen = data.id;
    queue.push(data);
    pump();
  } else if (data.type === "stop") {
    gen = -1;
    queue = [];
  }
};
</script>

<script id="worklet" type="text/js-worker">
registerProcessor("rec", class extends AudioWorkletProcessor {
  buf = new Float32Array(Math.round(sampleRate * 0.02));
  n = 0;
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.buf[this.n++] = ch[i];
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.slice()); this.n = 0; }
    }
    return true;
  }
});
</script>

<script>
const SILENCE_MS = 270;   // pause that ends a segment, which is then transcribed
const TURN_MS = 1440;     // in a call, silence that ends your turn and sends it to the model
const FRAME_MS = 20;
const MAX_SEGMENT_MS = 25000;
const MIN_SPEECH_MS = 200;
const PREROLL_FRAMES = 10;
const TAIL_FRAMES = 10;
const VOICE_TIMEOUT_MS = 45000;
const VOICE_GAIN = 2;
// 4 threads is Paradee's measured peak here: 7.4x real time on 1, 10.1x on 2, 12.0x on 4, 10.1x on 8.
const PARADEE_THREADS = Math.max(1, Math.min(4, navigator.hardwareConcurrency || 2));
const API = "https://inference.baseten.co/v1/chat/completions";
const SYSTEM = "You are on a live voice call. Answer in one to three short, plain spoken sentences. No markdown, lists, emojis, code or stage directions. Sound like a person talking.";

const $ = (id) => document.getElementById(id);
const blobUrl = (id, shared) => URL.createObjectURL(new Blob([(shared ? $("shared").textContent : "") + $(id).textContent], { type: "text/javascript" }));
const idle = () => { $("mic").disabled = false; $("mic").textContent = "Start"; $("mic").setAttribute("aria-pressed", "false"); };
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const rms = (f) => { let s = 0; for (let i = 0; i < f.length; i++) s += f[i] * f[i]; return Math.sqrt(s / f.length); };

if (location.protocol === "file:") {
  for (const id of ["mic", "read", "call", "call_groq", "call_mercury"]) $(id).textContent = "Serve over http";
  $("meta").textContent = "Opened from disk. Run: node server.mjs, then open http://localhost:8123";
  throw new Error("file: origin cannot start the workers");
}

$("key").value = store.get("key", "");
$("key").onchange = () => store.set("key", $("key").value.trim());
$("model").value = store.get("model", "openai/gpt-oss-120b");
$("model").onchange = () => store.set("model", $("model").value.trim());
$("groq_model").value = store.get("groq_model", "openai/gpt-oss-120b");
if (!$("groq_model").value) $("groq_model").value = "openai/gpt-oss-120b";
$("groq_model").onchange = () => store.set("groq_model", $("groq_model").value);
$("barge").checked = store.get("barge", "") === "1";
$("barge").onchange = () => store.set("barge", $("barge").checked ? "1" : "");

// ---------- the voices ----------
// Two run on the device: Paradee, and Gradium's Phonon, which is three entries because where it
// runs is worth choosing per machine (`cpu` is the measured-safe one, `webgpu` insists on the GPU,
// `auto` takes the GPU only when the browser offers a hardware adapter). The rest are remote:
// Kyutai's Pocket TTS on your own Baseten deployment (Baseten's library does not carry it), and
// Orpheus on Groq, which is the only voice Groq hosts. `rate` is each one's own output rate and is
// only a hint: the real rate comes from the wav header, and the AudioContext is built at it so
// nothing is ever resampled.
const PROVIDER_NAME = { baseten: "Baseten", groq: "Groq", openrouter: "OpenRouter" };
const VOICES = {
  paradee:        { label: "Paradee 8M · on device",     rate: 24000, local: "paradee" },
  phonon:         { label: "Phonon 31M · on device",     rate: 24000, local: "phonon", device: "cpu" },
  phonon_auto:    { label: "Phonon 31M · auto device",   rate: 24000, local: "phonon", device: "auto" },
  phonon_gpu:     { label: "Phonon 31M · WebGPU",        rate: 24000, local: "phonon", device: "webgpu" },
  pocket_18m:     { label: "Pocket TTS 18M · Baseten",   rate: 24000, provider: "baseten", model: "english_18m_2026-10" },
  pocket_7m:      { label: "Pocket TTS 7M · Baseten",    rate: 24000, provider: "baseten", model: "english_7m_2026-10" },
  pocket_7m_refl: { label: "Pocket TTS 7M rl · Baseten", rate: 24000, provider: "baseten", model: "english_7m_refl_2026-10" },
  pocket_2m:      { label: "Pocket TTS 2M · Baseten",    rate: 24000, provider: "baseten", model: "english_2m_2026-10" },
  orpheus:        { label: "Orpheus · Groq",             rate: 24000, provider: "groq", model: "canopylabs/orpheus-v1-english", voice: "autumn" },
};
const TTS_MAX_CHARS = 180; // Groq's Orpheus rejects input over 200 characters
const PHONON_MAX_CHARS = 400; // Phonon has no limit and splits by sentence itself; this just bounds one call
const PHONON_GAIN = 2; // its peaks measure 0.42-0.45, so this lands just under full scale
// Phonon's checkpoint, pinned to a commit and named file by file. A ModelSpec instead of
// `hf://gradium/phonon-31m-en@<sha>` skips the Hub API lookup the package makes on every load
// (measured 0.52 s) and makes the host one constant: on an S3 or CloudFront static site point
// PHONON_BASE at the bucket and the weights come from the same origin as the page. S3 has no
// per-file size cap, unlike Cloudflare Pages, which refuses any asset over 25 MiB.
// These URLs are byte for byte the ones the package would have built, so anything already cached
// from a Hub-resolved load still hits.
const PHONON_BASE = "https://huggingface.co/gradium/phonon-31m-en/resolve/8c64b55ec301728e2d1695bfea87a08a267d0c2d/";
const PHONON_WEIGHTS = PHONON_BASE + "model.q8.gguf";
const PHONON_MODEL = {
  weights: { q8: PHONON_WEIGHTS },
  tokenizer: PHONON_BASE + "tokenizer.json",
  config: PHONON_BASE + "config.json",
  voices: { default: PHONON_BASE + "default-voice.safetensors" },
  defaultVoice: "default",
};
const PHONON_FILES = [PHONON_MODEL.config, PHONON_MODEL.tokenizer, PHONON_MODEL.voices.default, PHONON_WEIGHTS];
const PHONON_CACHE = "phonon-tts-v1"; // CACHE_NAME in lib/phonon/fetch.js: looked in before the network
const PHONON_CHUNK = 8 << 20; // 8 MB a range. Sequential: 8 parallel ranges measured 1.01 MB/s against 1.59 for one
const PHONON_PREFETCH = true; // false stops the 64.5 MB download happening before anyone asks for it

let engine = store.get("engine", "paradee");
if (!VOICES[engine]) engine = "paradee";
const local = () => Boolean(VOICES[engine].local);
// Paradee loads with the page, so it has to finish first. Phonon fetches its 69 MB checkpoint only
// when picked, and can be asked to speak while that is still running. A remote voice needs nothing
// but its key on the server.
const voiceReady = () => {
  const v = VOICES[engine];
  if (v.local === "paradee") return ready.voice;
  return v.local === "phonon" || Boolean(serverTts[v.provider]);
};

function buildEngines() {
  const sel = $("engine");
  sel.textContent = "";
  for (const [name, v] of Object.entries(VOICES)) {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = v.label;
    o.disabled = !v.local && !serverTts[v.provider];
    sel.append(o);
  }
  // only once /api/config has answered: before that every remote voice looks keyless
  if (configured && !VOICES[engine].local && !serverTts[VOICES[engine].provider]) engine = "paradee";
  sel.value = engine;
}

// one place that decides whether the page can speak, and says why not
function readable() {
  const ok = voiceReady();
  $("read").disabled = !ok || Boolean(call);
  $("read").textContent = speakId ? "Stop reading"
    : ok ? "Read aloud"
    : local() ? "Loading voice…"
    : `No ${PROVIDER_NAME[VOICES[engine].provider]} voice key`;
  refresh();
}

$("engine").onchange = () => {
  stopReading();
  engine = $("engine").value;
  store.set("engine", engine);
  audioOut(); // rebuilt at the new rate before the first sentence, not during it
  preloadEngine();
  readable();
};

// When the page is served by server.mjs (or a deployed /api/chat), that server holds the Baseten key
// and forwards the calls, so the key never reaches the browser. Otherwise the pasted key is used.
let serverKey = false, serverGroq = false, serverOpenRouter = false, serverTts = {}, configured = false;
fetch("/api/config").then((r) => (r.ok ? r.json() : {})).then((c) => {
  configured = true;
  serverKey = Boolean(c.key);
  serverGroq = Boolean(c.providers?.groq);
  serverOpenRouter = Boolean(c.providers?.openrouter);
  serverTts = c.tts ?? {};
  buildEngines();
  readable();
  if (!serverKey) return;
  $("keyrow").hidden = true;
  $("keynote").textContent = "Replies go through this page's server, which holds the Baseten key; it never reaches the browser. What you say goes to the model as text; audio never leaves this device.";
}).catch(() => {});

const ready = { whistle: false, voice: false };
const refresh = () => { if (ready.whistle && voiceReady() && !call) { $("call").disabled = false; $("call_groq").disabled = !serverGroq; $("call_mercury").disabled = !serverOpenRouter; } };

let call = null;       // the live call, or null
let pendingAsr = 0;    // segments sent to Whistle and not yet transcribed

function dictate(text) {
  const out = $("out");
  out.value += (out.value && !/\s$/.test(out.value) ? " " : "") + text;
  out.scrollTop = out.scrollHeight;
}

const worker = new Worker(blobUrl("worker", true));
worker.onmessage = ({ data }) => {
  if (data.type === "ready") { ready.whistle = true; idle(); refresh(); }
  else if (data.type === "error") { pendingAsr = Math.max(0, pendingAsr - 1); $("meta").textContent = data.message; }
  else {
    pendingAsr--;
    const t = data.transcript;
    const text = t.text.trim();
    $("meta").textContent = `${t.language || "-"} · ${(performance.now() - data.sent).toFixed(0)} ms`;
    if (text) (call ? heard : dictate)(text);
    else if (call) maybeFire();
  }
};

// ---------- speech out ----------
// Paradee runs in its own worker and streams one sentence at a time.
let voice, voiceTimer;
// If the voice is not ready after VOICE_TIMEOUT_MS, retry on one thread: threaded onnxruntime fails
// silently when its worker script is refused (for example a stale cached copy without the isolation headers).
function startVoice(threads = PARADEE_THREADS) {
  voice?.terminate();
  voice = new Worker(blobUrl("voice", true));
  voice.onmessage = onVoice;
  voice.postMessage({ type: "init", base: new URL("./", location.href).href, threads });
  clearTimeout(voiceTimer);
  voiceTimer = setTimeout(() => {
    if (ready.voice) return;
    if (threads === 1) $("meta").textContent = "The voice is not loading. Hard-reload (Ctrl+Shift+R) or clear this site's data.";
    else startVoice(1);
  }, VOICE_TIMEOUT_MS);
}

let playCtx = null, nextAt = 0, sources = [], speakId = 0, generated = false, seq = 0, speaking = false;
let rq = { id: 0, buf: "", busy: false, done: false, abort: null }; // the remote voice's queue
let pq = { id: 0, buf: "", busy: false, done: false, stream: null }; // Phonon's queue

// Paradee outputs 24 kHz, and the remote voices have their own rates. A context at any other rate
// makes Chrome resample every buffer with linear interpolation, which adds imaging distortion
// (measured: 0.35% of energy above 12 kHz), so the context is always built at the voice's own rate.
// Switching rate means a new context, which is only safe while nothing is scheduled.
function audioOut(rate = VOICES[engine].rate) {
  if (playCtx && playCtx.sampleRate !== rate && !sources.length) {
    playCtx.close().catch(() => {});
    playCtx = null;
    nextAt = 0;
  }
  if (!playCtx) {
    try { playCtx = new AudioContext({ sampleRate: rate, latencyHint: "playback" }); }
    catch { playCtx = new AudioContext({ latencyHint: "playback" }); }
  }
  return playCtx;
}

// Paradee is quiet (RMS about -26 dBFS, peaks 0.3-0.44). Boosting it lets the system volume stay lower,
// which keeps the analog output stage's own hiss down; the cap keeps it from clipping.
// A streaming engine passes `fixed` instead: its chunks are 80 ms, and scaling each one by its own
// peak would make the level pump between syllables.
function play(samples, fixed) {
  let gain = fixed;
  if (gain === undefined) {
    let peak = 0;
    for (let i = 0; i < samples.length; i++) peak = Math.max(peak, Math.abs(samples[i]));
    gain = Math.min(VOICE_GAIN, 0.95 / (peak || 1));
  }
  for (let i = 0; i < samples.length; i++) samples[i] *= gain;
  const ctx = audioOut();
  const buf = ctx.createBuffer(1, samples.length, ctx.sampleRate);
  buf.copyToChannel(samples, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.onended = () => { sources = sources.filter((s) => s !== src); if (generated && !sources.length) finished(); };
  nextAt = Math.max(nextAt, ctx.currentTime + 0.05);
  src.start(nextAt);
  nextAt += buf.duration;
  sources.push(src);
  speaking = true;
  if (call?.state === "thinking") {
    call.state = "speaking";
    $("meta").textContent += ` · first audio ${(performance.now() - call.t0).toFixed(0)} ms`;
  }
}

function stopReading() {
  speakId = 0;
  generated = false;
  speaking = false;
  voice.postMessage({ type: "stop" }); // both are stopped, so a voice switch mid-sentence leaves nothing running
  rq.abort?.abort();
  rq = { id: 0, buf: "", busy: false, done: false, abort: null };
  pq.stream?.cancel();
  pq = { id: 0, buf: "", busy: false, done: false, stream: null };
  sources.forEach((s) => { s.onended = null; try { s.stop(); } catch {} });
  sources = [];
  nextAt = 0;
  $("read").textContent = "Read aloud";
}

// the reply has been spoken to the end
function finished() {
  stopReading();
  if (!call) return;
  call.state = "listening";
  call.turn = ""; call.committed = false; call.userLine = call.aiLine = null;
  quietUntil = performance.now() + 400; // room echo of the reply's last words
}

function onVoice({ data }) {
  if (data.type === "ready") {
    ready.voice = true;
    clearTimeout(voiceTimer);
    // say what it got: threaded onnxruntime silently drops to one thread on a page that is not
    // cross-origin isolated, which costs about 40% and is otherwise invisible
    if (!$("meta").textContent) $("meta").textContent = `Paradee: fp32, ${data.threads} thread${data.threads === 1 ? "" : "s"}`;
    if (VOICES[engine].local !== "phonon") (window.requestIdleCallback ?? ((f) => setTimeout(f, 3000)))(() => prefetchPhonon());
    readable();
  }
  else if (data.type === "error") $("meta").textContent = data.message;
  else if (data.type === "audio" && data.id === speakId) play(data.samples);
  else if (data.type === "done" && data.id === speakId) { generated = true; if (!sources.length) finished(); }
}
if (!crossOriginIsolated) $("meta").textContent = "Not cross-origin isolated, so the voice gets one thread. Serve this page with COOP and COEP (server.mjs and _headers do).";
startVoice();

// ---------- the remote voices ----------
// A wav header carries the real sample rate at bytes 24-27. The context is built at it, so neither
// decoding nor playback resamples. Anything that is not a RIFF wav falls back to the voice's hint.
function wavRate(bytes) {
  if (bytes.byteLength < 28) return 0;
  const d = new DataView(bytes);
  if (d.getUint32(0, false) !== 0x52494646) return 0; // "RIFF"
  const r = d.getUint32(24, true);
  return r >= 8000 && r <= 192000 ? r : 0;
}

async function fetchVoice(text) {
  const v = VOICES[engine];
  const res = await fetch("/api/tts", {
    method: "POST",
    signal: rq.abort.signal,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ provider: v.provider, model: v.model, text, ...(v.voice && { voice: v.voice }) }),
  });
  if (!res.ok) throw new Error(`${PROVIDER_NAME[v.provider]} voice ${res.status}: ${(await res.text()).slice(0, 160)}`);
  const bytes = await res.arrayBuffer();
  const buf = await audioOut(wavRate(bytes) || v.rate).decodeAudioData(bytes);
  return buf.getChannelData(0);
}

// One sentence per request, and the tail only once the text is complete, so audio starts before
// the whole reply is written. A sentence over the provider's limit is cut at a word.
function takePiece(q, cap) {
  const m = q.buf.match(/^[\s\S]*?[.!?…](?=\s|$)/);
  let piece = m ? m[0] : q.done ? q.buf : "";
  if (!piece.trim()) return "";
  let rest = q.buf.slice(piece.length);
  if (piece.length > cap) {
    let cut = piece.lastIndexOf(" ", cap);
    if (cut <= 0) cut = cap;
    rest = piece.slice(cut) + rest;
    piece = piece.slice(0, cut);
  }
  q.buf = rest.trim();
  return piece.trim();
}

async function remotePump() {
  if (rq.busy) return;
  rq.busy = true;
  const id = rq.id;
  try {
    for (let piece; (piece = takePiece(rq, TTS_MAX_CHARS)); ) {
      if (id !== speakId) break; // text that arrived while a request was in flight can out-run a stop
      rq.abort = new AbortController();
      const samples = await fetchVoice(piece);
      if (id !== speakId) break;
      play(samples);
    }
    if (rq.done && !rq.buf.trim() && id === speakId) { generated = true; if (!sources.length) finished(); }
  } catch (e) {
    if (e.name !== "AbortError") { $("meta").textContent = "voice: " + (e.message || e); stopReading(); }
  }
  rq.busy = false;
}

function remoteSpeak(id, text, last) {
  if (id !== rq.id) { rq.abort?.abort(); rq = { id, buf: "", busy: false, done: false, abort: null }; }
  rq.buf = (rq.buf + " " + text).trim();
  rq.done ||= last;
  remotePump();
}

// ---------- Phonon, the other on-device voice ----------
// The package starts its own worker, so this stays on the main thread and only shuttles chunks.
// It yields 80 ms of audio at a time, which is why it reaches first sound in about 220 ms where a
// one-shot vocoder has to finish a whole clause first. The checkpoint is 69 MB, so it is fetched
// only once this voice is picked, and the Cache API keeps it after that. q8 is asked for because it
// measured no slower than f32 in wasm and is the only format the package will put on WebGPU.
let phonon = null; // { device, ready: Promise<PhononTTS> }

function loadPhonon(device) {
  if (phonon?.device !== device) {
    phonon?.ready.then((tts) => tts.dispose(), () => {});
    phonon = {
      device,
      ready: (async () => {
        const t0 = performance.now();
        let downloaded = false;
        const { PhononTTS } = await import("./lib/phonon/index.js");
        const tts = await PhononTTS.load({
          lang: "en",
          quant: "q8", // the only format the package will put on WebGPU, and no slower than f32 in wasm
          model: PHONON_MODEL,
          device,
          threads: "auto",
          onProgress: (p) => {
            if (p.cached || !p.total) return;
            downloaded = true;
            $("meta").textContent = `Phonon ${p.file} ${Math.round((p.loaded / p.total) * 100)}%`;
          },
        });
        $("meta").textContent = `Phonon: ${tts.device}, ${tts.threads} thread${tts.threads === 1 ? "" : "s"}, ` +
          `${((performance.now() - t0) / 1000).toFixed(1)} s ${downloaded ? "downloaded" : "from cache"}` +
          (tts.device === "cpu" && device !== "cpu" ? ` (${tts.deviceReason})` : "");
        return tts;
      })(),
    };
  }
  return phonon.ready;
}

function phononFailed(e) {
  $("meta").textContent = "Phonon: " + (e.message || e);
  phonon = null; // a failed load must not be handed to the next request
}

// picking the voice is enough intent to start the download, so Read aloud is not the thing that waits
function preloadEngine() {
  if (VOICES[engine].local === "phonon") loadPhonon(VOICES[engine].device).catch(phononFailed);
}

// Warms the package's own cache with the checkpoint without starting the model, so picking this
// voice later costs no download and nothing is resident until it is actually wanted. Worth doing
// because the download cannot be made fast: measured 1.59 MB/s from the Hub, 1.92 from
// Cloudflare's edge, 1.09 from jsdelivr, and 1.01 across 8 parallel ranges, which is one saturated
// ~15 Mbit line. 64.5 MB over it is 34 s whoever serves it, so the only way to make the wait
// disappear is to have already waited.
async function prefetchPhonon() {
  if (!PHONON_PREFETCH || typeof caches === "undefined") return;
  const conn = navigator.connection;
  if (conn?.saveData || /2g$/.test(conn?.effectiveType ?? "")) return; // not on someone's phone data
  const store = await caches.open(PHONON_CACHE).catch(() => null);
  if (!store) return;
  for (const url of PHONON_FILES) {
    if (await store.match(url).catch(() => undefined)) continue;
    try {
      if (url === PHONON_WEIGHTS) await fetchInParts(store, url);
      else await store.add(url);
    } catch (e) {
      console.warn("[phonon] prefetch stopped at " + url, e); // the real load will just download it
      return;
    }
  }
  console.log("[phonon] checkpoint cached: selecting the voice no longer waits on the network");
}

// Sequential ranges, each cached under its own key, so a closed tab resumes where it stopped instead
// of starting the 34 s again. Cache.put refuses a 206, hence the rebuilt Response. A server that
// refuses ranges, or a browser that will not send the header cross-origin, falls back to one stream.
async function fetchInParts(store, url) {
  const probe = await fetch(url, { headers: { Range: "bytes=0-0" } });
  const total = Number(probe.headers.get("content-range")?.split("/")[1]);
  if (probe.status !== 206 || !Number.isFinite(total) || total <= 0) return store.add(url);
  const parts = [];
  for (let at = 0; at < total; at += PHONON_CHUNK) {
    const key = `${url}?part=${at}`;
    const hit = await store.match(key).catch(() => undefined);
    if (hit) { parts.push(await hit.blob()); continue; }
    const end = Math.min(at + PHONON_CHUNK, total) - 1;
    const res = await fetch(url, { headers: { Range: `bytes=${at}-${end}` } });
    if (res.status !== 206) throw new Error(`range from ${at} answered HTTP ${res.status}`);
    const blob = await res.blob();
    await store.put(key, new Response(blob));
    parts.push(blob);
  }
  await store.put(url, new Response(new Blob(parts), { headers: { "content-length": String(total) } }));
  for (let at = 0; at < total; at += PHONON_CHUNK) await store.delete(`${url}?part=${at}`);
}

async function phononPump() {
  const q = pq;
  if (q.busy) return;
  q.busy = true;
  try {
    const tts = await loadPhonon(VOICES[engine].device);
    for (let piece; (piece = takePiece(q, PHONON_MAX_CHARS)); ) {
      if (q !== pq || q.id !== speakId) break; // text can out-run a stop or a voice switch
      q.stream = tts.stream(piece);
      for await (const chunk of q.stream) {
        if (q !== pq || q.id !== speakId) break; // breaking the loop cancels the stream
        play(chunk, PHONON_GAIN);
      }
      await q.stream.done.catch(() => {});
      q.stream = null;
    }
    if (q.done && !q.buf.trim() && q === pq && q.id === speakId) { generated = true; if (!sources.length) finished(); }
  } catch (e) {
    if (e.name !== "AbortError") { phononFailed(e); stopReading(); }
  }
  q.busy = false;
}

function phononSpeak(id, text, last) {
  if (id !== pq.id) { pq.stream?.cancel(); pq = { id, buf: "", busy: false, done: false, stream: null }; }
  pq.buf = (pq.buf + " " + text).trim();
  pq.done ||= last;
  phononPump();
}

// Paradee streams out of its worker, Phonon out of its own, and a remote voice is fetched a sentence
// at a time. Either way the caller just hands over text as it arrives and marks the last piece.
function speak(id, text, last) {
  const kind = VOICES[engine].local;
  if (kind === "paradee") voice.postMessage({ type: "speak", id, text, last });
  else if (kind === "phonon") phononSpeak(id, text, last);
  else remoteSpeak(id, text, last);
}

$("read").onclick = () => {
  if (speakId) { stopReading(); readable(); return; }
  const text = $("out").value.trim();
  if (!text) { $("meta").textContent = "Nothing to read yet"; return; }
  audioOut().resume();
  live?.seg.flush(); // the mic is ignored while reading, otherwise the speaker output gets transcribed
  speakId = ++seq;
  $("read").textContent = "Stop reading";
  speak(speakId, text, true);
};

// ---------- speech in ----------
function to16k(frames, rate) {
  const pcm = new Float32Array(frames.reduce((a, f) => a + f.length, 0));
  frames.reduce((o, f) => (pcm.set(f, o), o + f.length), 0);
  if (rate === 16000) return pcm;
  const out = new Float32Array(Math.floor((pcm.length * 16000) / rate));
  for (let i = 0; i < out.length; i++) {
    const x = (i * rate) / 16000, j = x | 0, f = x - j;
    out[i] = pcm[j] * (1 - f) + (pcm[j + 1] ?? pcm[j]) * f;
  }
  return out;
}

async function open() {
  if (!navigator.mediaDevices) throw new Error("needs https or localhost");
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  try {
    let ctx, src;
    try { ctx = new AudioContext({ sampleRate: 16000 }); src = ctx.createMediaStreamSource(stream); }
    catch { ctx?.close(); ctx = new AudioContext(); src = ctx.createMediaStreamSource(stream); }
    await ctx.audioWorklet.addModule(blobUrl("worklet"));
    const node = new AudioWorkletNode(ctx, "rec", { numberOfOutputs: 0 });
    src.connect(node);
    return { stream, ctx, node };
  } catch (e) {
    stream.getTracks().forEach((t) => t.stop());
    throw e;
  }
}

function segmenter(rate) {
  let floor = 0.005, preroll = [], seg = null, onset = 0, silent = 0, voiced = 0, quiet = 0;
  const send = (frames) => {
    const audio = to16k(frames, rate);
    pendingAsr++;
    worker.postMessage({ audio, sent: performance.now() }, [audio.buffer]);
  };
  const cut = () => {
    if (voiced * FRAME_MS >= MIN_SPEECH_MS) send(seg.slice(0, seg.length - Math.max(0, silent - TAIL_FRAMES)));
    seg = null; preroll = []; onset = 0; silent = 0; voiced = 0;
  };
  return {
    get floor() { return floor; },
    get inSpeech() { return !!seg; },
    get quietMs() { return quiet * FRAME_MS; },
    seed(frames) { seg = frames.slice(); voiced = frames.length; silent = 0; quiet = 0; },
    feed(f) {
      const loud = rms(f) > Math.max(0.01, floor * 4);
      quiet = loud ? 0 : quiet + 1;
      if (!seg) {
        if (!loud) floor = Math.max(0.002, floor * 0.95 + rms(f) * 0.05);
        preroll.push(f);
        if (preroll.length > PREROLL_FRAMES) preroll.shift();
        onset = loud ? onset + 1 : 0;
        if (onset >= 2) { seg = preroll; voiced = onset; silent = 0; }
        return;
      }
      seg.push(f);
      if (loud) { silent = 0; voiced++; } else silent++;
      if (silent * FRAME_MS >= SILENCE_MS || seg.length * FRAME_MS >= MAX_SEGMENT_MS) cut();
    },
    flush() { if (seg) cut(); },
  };
}

let live = null;       // { stream, ctx, seg } while the mic is open

async function listen(onframe) {
  const { stream, ctx, node } = await open();
  live = { stream, ctx, node, seg: segmenter(ctx.sampleRate) };
  node.port.onmessage = ({ data }) => onframe(data);
}

function unlisten(flush) {
  const { stream, ctx, node, seg } = live;
  live = null;
  node.port.onmessage = null; // frames already queued would otherwise reach a closed mic
  if (flush) seg.flush();
  stream.getTracks().forEach((t) => t.stop());
  ctx.close();
}

$("mic").onclick = async () => {
  const b = $("mic");
  if (live) { unlisten(true); idle(); return; }
  b.disabled = true;
  try {
    await listen((f) => { if (!speaking) live.seg.feed(f); });
    b.textContent = "Stop"; b.setAttribute("aria-pressed", "true"); b.disabled = false;
    $("meta").textContent = "";
  } catch (e) {
    idle();
    $("meta").textContent = `Microphone: ${e.name}: ${e.message}`;
  }
};

// ---------- the call ----------
let quietUntil = 0, ring = [], loudRun = 0;

function chatLine(who) {
  const p = document.createElement("p");
  p.textContent = who + ": ";
  $("chat").append(p);
  return p;
}

function callFrame(f) {
  if (speaking) {
    if (!$("barge").checked) return;
    ring.push(f);
    if (ring.length > 50) ring.shift();
    // leaky count: speech dips below the threshold between syllables, so a gap must not reset it
    loudRun = rms(f) > Math.max(0.03, live.seg.floor * 6) ? loudRun + 1 : Math.max(0, loudRun - 0.5);
    if (loudRun >= 8) {
      interrupt();
      live.seg.seed(ring);
    }
    return;
  }
  ring.length = 0; loudRun = 0;
  if (performance.now() < quietUntil) return;
  live.seg.feed(f);
  maybeFire();
}

// you spoke: a transcript arrived
function heard(text) {
  if (call.state === "thinking") { // still waiting on the reply, so this continues your turn
    call.abort?.abort();
    stopReading();
    call.aiLine?.remove();
    call.aiLine = null;
    if (call.committed) { call.history.splice(-2); call.committed = false; }
    call.pending = call.turn;
    call.turn = "";
    call.state = "listening";
  } else if (call.state !== "listening") return;
  call.pending = (call.pending + " " + text).trim();
  call.userLine ??= chatLine("You");
  call.userLine.textContent = "You: " + call.pending;
  maybeFire();
}

function maybeFire() {
  if (!call || call.state !== "listening" || !call.pending || pendingAsr > 0) return;
  if (live.seg.inSpeech || live.seg.quietMs < TURN_MS) return;
  fire();
}

function interrupt() {
  call.abort?.abort();
  if (!call.committed && call.turn) call.history.push({ role: "user", content: call.turn }, { role: "assistant", content: call.reply });
  stopReading();
  call.state = "listening";
  call.turn = ""; call.committed = false; call.userLine = call.aiLine = null;
  ring = []; loudRun = 0;
}

// Only delta.content is spoken; reasoning models also stream delta.reasoning, which is ignored.
async function complete(messages, signal, onDelta) {
  const provider = call.provider, model = call.model;
  // only Baseten can be called straight from the page with a pasted key; the other providers always go through the server
  const viaServer = serverKey || provider !== "baseten";
  const res = await fetch(viaServer ? "/api/chat" : API, {
    method: "POST",
    signal,
    headers: { "Content-Type": "application/json", ...(!viaServer && { Authorization: "Bearer " + $("key").value.trim() }) },
    body: JSON.stringify({
      ...(viaServer && { provider }),
      model, messages, stream: true, max_tokens: 150, temperature: 0.7,
      ...(model.includes("gpt-oss") && { reasoning_effort: "low" }),
      ...(provider === "groq" && model === "qwen/qwen3.8-27b" && { reasoning_effort: "none" }),
    }),
  });
  if (!res.ok) throw new Error(`${PROVIDER_NAME[provider]} ${res.status}: ${(await res.text()).slice(0, 160)}`);
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) return;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data:")) continue;
      const data = line.slice(5).trim();
      if (data === "[DONE]") return;
      let j;
      try { j = JSON.parse(data); } catch { continue; }
      if (j.error) throw new Error(j.error.message || "stream error");
      const d = j.choices?.[0]?.delta?.content;
      if (d) onDelta(d);
    }
  }
}

// your turn is over: ask the model and speak its reply as it streams
async function fire() {
  const c = call;
  const user = c.pending;
  c.turn = user; c.pending = ""; c.reply = ""; c.committed = false; c.state = "thinking"; c.t0 = performance.now();
  c.aiLine = chatLine("AI");
  c.abort = new AbortController();
  const id = (speakId = ++seq);
  generated = false;
  const say = (text, last) => speak(id, text, last);
  const messages = [{ role: "system", content: SYSTEM }, ...c.history, { role: "user", content: user }];
  const t0 = performance.now();
  let buf = "", started = false;
  try {
    await complete(messages, c.abort.signal, (delta) => {
      if (!c.reply) $("meta").textContent = `first token ${(performance.now() - t0).toFixed(0)} ms`;
      c.reply += delta;
      c.aiLine.textContent = "AI: " + c.reply;
      buf += delta.replace(/[*_`#>~|]|\p{Extended_Pictographic}/gu, "");
      const sentences = buf.split(/(?<=[.!?…])\s+/);
      buf = sentences.pop();
      if (sentences.length) { say(sentences.join(" "), false); started = true; }
      else if (!started) { // nothing spoken yet: start at the first clause break instead of waiting for a whole sentence
        const clause = buf.match(/^(.{20,}?[,;:—])\s+/s);
        if (clause) { say(clause[1], false); buf = buf.slice(clause[0].length); started = true; }
      }
    });
    if (buf.trim()) say(buf, false);
    say("", true);
    c.history.push({ role: "user", content: user }, { role: "assistant", content: c.reply });
    c.history.splice(0, Math.max(0, c.history.length - 12));
    c.committed = true;
  } catch (e) {
    if (e.name === "AbortError") return;
    $("meta").textContent = e.message;
    stopReading();
    c.state = "listening"; c.turn = ""; c.userLine = c.aiLine = null;
  }
}

const CALLS = { baseten: ["call", "Call Baseten"], groq: ["call_groq", "Call Groq"], openrouter: ["call_mercury", "Call Mercury 3"] };
const FIXED_MODEL = { openrouter: "inception/mercury-3" };

function setCallUi(on) {
  for (const [name, [id, label]] of Object.entries(CALLS)) {
    const mine = on && call.provider === name;
    $(id).textContent = mine ? "Hang up" : label;
    $(id).setAttribute("aria-pressed", mine ? "true" : "false");
    $(id).disabled = on && !mine;
  }
  $("mic").disabled = on;
  $("engine").disabled = on; // switching voice mid-call would cut the reply being spoken
  $("groq_model").disabled = on;
  $("mute").disabled = !on;
  $("mute").textContent = "Mute";
  $("mute").setAttribute("aria-pressed", "false");
  readable();
}

// a disabled mic track sends silence, so the segmenter just sees no speech
$("mute").onclick = () => {
  const t = live.stream.getAudioTracks()[0];
  t.enabled = !t.enabled;
  $("mute").textContent = t.enabled ? "Mute" : "Unmute";
  $("mute").setAttribute("aria-pressed", t.enabled ? "false" : "true");
};

function hangup() {
  call.abort?.abort();
  stopReading();
  unlisten(false);
  call = null;
  setCallUi(false);
  $("call_groq").disabled = !serverGroq;
  $("call_mercury").disabled = !serverOpenRouter;
}

async function start_call(provider) {
  if (call) { hangup(); return; }
  if (provider === "baseten" && !serverKey && !$("key").value.trim()) {
    $("settings").open = true;
    $("key").focus();
    $("meta").textContent = "Paste your Baseten API key first";
    return;
  }
  $(CALLS[provider][0]).disabled = true;
  audioOut().resume();
  call = { provider, model: provider === "groq" ? $("groq_model").value : FIXED_MODEL[provider] ?? $("model").value.trim(), state: "listening", pending: "", turn: "", reply: "", committed: false, history: [], abort: null, userLine: null, aiLine: null };
  try {
    await listen(callFrame);
  } catch (e) {
    call = null;
    $(CALLS[provider][0]).disabled = false;
    $("meta").textContent = `Microphone: ${e.name}: ${e.message}`;
    return;
  }
  $("chat").textContent = "";
  $("meta").textContent = "";
  setCallUi(true);
}

$("call").onclick = () => start_call("baseten");
$("call_groq").onclick = () => start_call("groq");
$("call_mercury").onclick = () => start_call("openrouter");

buildEngines(); // the remote voices turn on when /api/config says their key is there
preloadEngine();
readable();
</script>
